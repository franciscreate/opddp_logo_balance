const rotAbout=(px,py,cx,cy,deg)=>{const c=Math.cos(deg*PI/180),s=Math.sin(deg*PI/180),dx=px-cx,dy=py-cy;return[cx+dx*c-dy*s,cy+dx*s+dy*c]};
function pose(t){
  t=((t%CYC)+CYC)%CYC;let seg=0,t0=0;while(t>=t0+SEG[seg][1]){t0+=SEG[seg][1];seg++}
  const name=SEG[seg][0],dur=SEG[seg][1],u=(t-t0)/dur,e=ease(u),out={};
  if(name==="rock"){
    const tr=t-t0,beta=sample(SIM.beta,tr),psi={A:sample(SIM.pa,tr),B:sample(SIM.pb,tr)};   // temps écoulé depuis le début de la partie « balance »
    for(const key of["P","A","B"]){const k3=KF[key][2];let x,y,a;
      if(key==="P"){x=k3[0];y=k3[1];a=k3[2]*90+beta}
      else{const H0=[k3[0],CC[1]],H=rotAbout(H0[0],H0[1],CC[0],CC[1],beta),d=rotAbout(k3[0],k3[1],H0[0],H0[1],psi[key]);   // le plateau pend de son point d'attache
        x=H[0]+(d[0]-H0[0]);y=H[1]+(d[1]-H0[1]);a=k3[2]*90+psi[key]}
      out[key]={x,y,a}}
    return out}
  for(const key of["P","A","B"]){
    const k3=KF[key][2],k4=KF[key][3];let x,y,k;
    if(name==="T34"){if(key==="P"){x=lerp(k3[0],k4[0],e);y=lerp(k3[1],k4[1],e);k=lerp(k3[2],k4[2],e)}else{[x,y]=polar(k3,k4,e,-1);k=lerp(k3[2],k4[2],e)}}
    else if(name==="T43"){if(key==="P"){x=lerp(k4[0],k3[0],e);y=lerp(k4[1],k3[1],e);k=lerp(k4[2],k3[2],e)}else{[x,y]=polar(k4,k3,e,1);k=lerp(k4[2],k3[2],e)}}
    else{x=k4[0];y=k4[1];k=k4[2]}
    out[key]={x,y,a:k*90}}
  return out}
const P2=PI*2;

let ready=false,T=0;
function render(t){
  const s=cv.width/S*ZOOM,ox=cv.width/2-1650*s,oy=cv.height/2-1650*s;
  ctx.setTransform(1,0,0,1,0,0);
  const iw=bg.naturalWidth||1,k=cv.width/iw*ZOOM;
  ctx.imageSmoothingQuality="high";ctx.drawImage(bg,cv.width/2-(S/2*(cv.width/S)*ZOOM)+0,cv.height/2-(S/2*(cv.width/S)*ZOOM),cv.width*ZOOM,cv.height*ZOOM);
  const P=pose(t),parts=[["P",PP],["A",PC],["B",PC]];
  const BIG=30000,sig=52.14,bl=2*sig*s;
  ctx.save();ctx.shadowColor="rgba(0,0,0,.15)";ctx.shadowBlur=bl;ctx.shadowOffsetX=BIG;ctx.shadowOffsetY=245*s;ctx.fillStyle="#000";
  for(const[key,pa]of parts){const p=P[key];ctx.setTransform(s,0,0,s,ox-BIG,oy);ctx.translate(p.x,p.y);ctx.rotate(p.a*PI/180);ctx.fill(pa)}
  ctx.restore();
  ctx.fillStyle=INK;
  for(const[key,pa]of parts){const p=P[key];ctx.setTransform(s,0,0,s,ox,oy);ctx.translate(p.x,p.y);ctx.rotate(p.a*PI/180);ctx.fill(pa)}
  ctx.setTransform(1,0,0,1,0,0)}
let vis=true,t0=performance.now();
if("IntersectionObserver"in window)new IntersectionObserver(e=>{vis=e[0].isIntersecting}).observe(cv);
const FIX=q.has("t");
bg.onload=()=>{ready=true;render(FIX?parseFloat(q.get("t")):0);
  if(!FIX&&!still)(function loop(now){requestAnimationFrame(loop);if(!vis)return;T=(now-t0)/1e3*SPD;render(T)})(performance.now())};
</script>
